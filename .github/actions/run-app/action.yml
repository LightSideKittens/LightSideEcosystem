name: 'Run Unity App'
description: 'Run Unity build (tests or benchmarks) on target platform and collect results'

inputs:
  platform:
    description: 'Target platform'
    required: true
  mode:
    description: 'test or benchmark'
    required: true
  suite:
    description: 'Benchmark suite: all, text (pipeline), glyph (rasterization) or motion. Ignored in test mode.'
    required: false
    default: 'all'
  unity_version:
    description: 'Unity version (used to separate Firebase results)'
    required: false
    default: 'unknown'
  build_path:
    description: 'Path to build directory'
    required: false
    default: 'build'
  timeout:
    description: 'Timeout in seconds'
    required: false
    default: '1800'
  legacy_android_devices:
    description: 'Replace the standard Android device park with affected legacy devices'
    required: false
    default: 'false'
  screen_recording:
    description: 'Keep the Firebase device screen recording under screen-recording/. It is the only capture that contains OS-owned layers - the soft keyboard, the native input field and its presenter surface, the status and navigation bars; no in-player capture reaches them on any platform.'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    # ----------------------------------------
    # Windows
    # ----------------------------------------
    - name: Run (Windows)
      if: inputs.platform == 'StandaloneWindows64'
      shell: pwsh
      env:
        APP_MODE: ${{ inputs.mode }}
        APP_TIMEOUT: ${{ inputs.timeout }}
        APP_SUITE: ${{ inputs.suite }}
      run: |
        $ErrorActionPreference = "Stop"
        $mode = $env:APP_MODE

        $exe = Get-ChildItem -Path ${{ inputs.build_path }} -Filter *.exe -Recurse | Select-Object -First 1
        if ($null -eq $exe) { Write-Host "ERROR: No .exe found"; exit 1 }

        $logName = if ($mode -eq "benchmark") { "benchmark.log" } else { "test.log" }
        $logFile = Join-Path (Get-Location).Path $logName
        $resultFile = if ($mode -eq "benchmark") { "benchmarkResults.json" } else { "testResults.xml" }
        $args = @("-logFile", $logFile)
        if ($mode -eq "test") { $args = @("-batchmode") + $args }
        if ($mode -eq "benchmark") { $args += @("-benchmarkSuite", $env:APP_SUITE) }

        Write-Host "Running ($mode): $($exe.FullName)"
        $process = Start-Process -FilePath $exe.FullName -ArgumentList $args -PassThru -NoNewWindow
        $timeout = [int]$env:APP_TIMEOUT
        if (-not $process.WaitForExit($timeout * 1000)) {
          Write-Host "ERROR: Timed out after $timeout seconds"
          $process.Kill()
          $exitCode = 124
        } else { $exitCode = $process.ExitCode }

        if (Test-Path $logFile) {
          Write-Host "=== $logFile (full) ==="
          Get-Content $logFile
        }

        Start-Sleep -Seconds 3

        $searchPath = "$env:LOCALAPPDATA\..\LocalLow"
        $found = $null
        for ($i = 0; $i -lt 5; $i++) {
          $found = Get-ChildItem -Path $searchPath -Filter $resultFile -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) { break }
          Write-Host "Attempt $($i+1): $resultFile not found, waiting..."
          Start-Sleep -Seconds 2
        }

        if ($found) {
          Copy-Item $found.FullName -Destination ./$resultFile
          Write-Host "Copied: $($found.FullName)"
        } else {
          Write-Host "WARNING: $resultFile not found"
        }

        if ($mode -eq "benchmark" -and $found) {
          $persist = $found.DirectoryName
          New-Item -ItemType Directory -Force -Path ./benchmark-streams | Out-Null
          Copy-Item "$persist\run-*.js" -Destination ./benchmark-streams/ -ErrorAction SilentlyContinue
          if (Test-Path "$persist\Screenshots") {
            New-Item -ItemType Directory -Force -Path ./screenshots | Out-Null
            Copy-Item "$persist\Screenshots\*.png" -Destination ./screenshots/ -ErrorAction SilentlyContinue
          }
        }

        if ($mode -eq "test") {
          $screenshotsDir = Get-ChildItem -Path $searchPath -Directory -Filter "Screenshots" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($screenshotsDir) {
            New-Item -ItemType Directory -Force -Path ./screenshots | Out-Null
            Copy-Item "$($screenshotsDir.FullName)\*.png" -Destination ./screenshots/ -ErrorAction SilentlyContinue
          }

          if (Test-Path ./$resultFile) {
            $failureCount = ([regex]::Matches((Get-Content ./$resultFile -Raw), '<failure')).Count
            if ($failureCount -gt 0) { Write-Host "ERROR: $failureCount test failure(s)"; exit 1 }
          }
        }

        exit $exitCode

    # ----------------------------------------
    # Linux
    # ----------------------------------------
    - name: Run (Linux)
      if: inputs.platform == 'StandaloneLinux64'
      shell: bash
      env:
        APP_MODE: ${{ inputs.mode }}
        APP_TIMEOUT: ${{ inputs.timeout }}
        APP_SUITE: ${{ inputs.suite }}
      run: |
        set -uo pipefail
        MODE="$APP_MODE"

        BUILD_DIR="${{ inputs.build_path }}/StandaloneLinux64"
        [ ! -d "$BUILD_DIR" ] && { echo "ERROR: $BUILD_DIR not found"; exit 1; }

        chmod +x "$BUILD_DIR"/* 2>/dev/null || true
        EXE=$(find "$BUILD_DIR" -maxdepth 1 -type f -executable ! -name "*.so*" | head -1)
        [ -z "$EXE" ] && { echo "ERROR: No executable found"; ls -la "$BUILD_DIR"; exit 1; }

        if [ "$MODE" = "benchmark" ]; then
          LOG_FILE="$PWD/benchmark.log"; RESULT_FILE="benchmarkResults.json"; EXTRA_ARGS="-benchmarkSuite $APP_SUITE"
        else
          LOG_FILE="$PWD/test.log"; RESULT_FILE="testResults.xml"; EXTRA_ARGS="-batchmode"
        fi

        echo "Running ($MODE): $EXE"

        # Beyond Noto: Liberation (Times/Arial/Courier metrics), Hanazono (CJK Ext B outlines), Unifont (SMP catch-all: Ext C/D/E + rare symbols), DejaVu (system baseline)
        sudo apt-get update -qq && sudo apt-get install -y -qq xserver-xorg-video-dummy x11-xserver-utils \
          fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji fonts-noto-extra fonts-noto-unhinted \
          fonts-liberation fonts-dejavu fonts-hanazono fonts-unifont

        cat > /tmp/xorg-dummy.conf << 'XORGEOF'
        Section "Device"
            Identifier "DummyDevice"
            Driver "dummy"
            VideoRam 256000
        EndSection
        Section "Screen"
            Identifier "DummyScreen"
            Device "DummyDevice"
            Monitor "DummyMonitor"
            DefaultDepth 24
            SubSection "Display"
                Depth 24
                Modes "1920x1080"
            EndSubSection
        EndSection
        Section "Monitor"
            Identifier "DummyMonitor"
            HorizSync 30-80
            VertRefresh 50-75
            Modeline "1920x1080" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +hsync +vsync
        EndSection
        XORGEOF

        sudo Xorg :99 -config /tmp/xorg-dummy.conf -noreset +extension GLX +extension RANDR &
        XORG_PID=$!
        sleep 3
        export DISPLAY=:99

        vblank_mode=0 timeout "$APP_TIMEOUT" "$EXE" $EXTRA_ARGS -force-glcore -logFile "$LOG_FILE" || EXIT_CODE=$?

        sudo kill $XORG_PID 2>/dev/null || true

        echo "=== $LOG_FILE ==="
        cat "$LOG_FILE" 2>/dev/null || echo "$LOG_FILE not found"

        FOUND=$(find ~/.config/unity3d -name "$RESULT_FILE" 2>/dev/null | head -1)
        [ -n "$FOUND" ] && cp "$FOUND" "./$RESULT_FILE" && echo "Copied: $FOUND" || echo "WARNING: $RESULT_FILE not found"

        if [ "$MODE" = "benchmark" ] && [ -n "$FOUND" ]; then
          PERSIST=$(dirname "$FOUND")
          mkdir -p ./benchmark-streams
          cp "$PERSIST"/run-*.js ./benchmark-streams/ 2>/dev/null || true
          if [ -d "$PERSIST/Screenshots" ]; then
            mkdir -p ./screenshots
            cp "$PERSIST"/Screenshots/*.png ./screenshots/ 2>/dev/null || true
          fi
        fi

        if [ "$MODE" = "test" ]; then
          SCREENSHOTS_DIR=$(find ~/.config/unity3d -name "Screenshots" -type d 2>/dev/null | head -1)
          if [ -n "$SCREENSHOTS_DIR" ]; then
            mkdir -p ./screenshots
            cp "$SCREENSHOTS_DIR"/*.png ./screenshots/ 2>/dev/null || true
          fi

          if [ -f "./$RESULT_FILE" ]; then
            FAILURE_COUNT=$(grep -c '<failure' "./$RESULT_FILE" 2>/dev/null || echo "0")
            [ "$FAILURE_COUNT" -gt 0 ] && { echo "ERROR: $FAILURE_COUNT test failure(s)"; exit 1; }
          fi
        fi

        exit ${EXIT_CODE:-0}

    # ----------------------------------------
    # macOS
    # ----------------------------------------
    - name: Run (macOS)
      if: inputs.platform == 'StandaloneOSX'
      shell: bash
      env:
        APP_MODE: ${{ inputs.mode }}
        APP_TIMEOUT: ${{ inputs.timeout }}
        APP_SUITE: ${{ inputs.suite }}
      run: |
        set -uo pipefail
        MODE="$APP_MODE"

        brew install coreutils 2>/dev/null || true

        APP=$(find ${{ inputs.build_path }} -name "*.app" -type d | head -1)
        [ -z "$APP" ] && { echo "ERROR: No .app found"; exit 1; }

        EXE=$(find "$APP/Contents/MacOS" -type f ! -name "*.dylib" | head -1)
        [ -z "$EXE" ] && { echo "ERROR: No executable found"; exit 1; }

        if [ "$MODE" = "benchmark" ]; then
          LOG_FILE="$PWD/benchmark.log"; RESULT_FILE="benchmarkResults.json"; EXTRA_ARGS="-benchmarkSuite $APP_SUITE"
        else
          LOG_FILE="$PWD/test.log"; RESULT_FILE="testResults.xml"; EXTRA_ARGS="-batchmode"
        fi

        echo "Running ($MODE): $EXE"
        chmod +x "$EXE"
        gtimeout "$APP_TIMEOUT" "$EXE" $EXTRA_ARGS -logFile "$LOG_FILE" || EXIT_CODE=$?

        echo "=== $LOG_FILE (full) ==="
        cat "$LOG_FILE" 2>/dev/null || echo "$LOG_FILE not found"

        FOUND=$(find ~/Library -name "$RESULT_FILE" 2>/dev/null | head -1)
        [ -n "$FOUND" ] && cp "$FOUND" "./$RESULT_FILE" && echo "Copied: $FOUND" || echo "WARNING: $RESULT_FILE not found"

        if [ "$MODE" = "benchmark" ] && [ -n "$FOUND" ]; then
          PERSIST=$(dirname "$FOUND")
          mkdir -p ./benchmark-streams
          cp "$PERSIST"/run-*.js ./benchmark-streams/ 2>/dev/null || true
          if [ -d "$PERSIST/Screenshots" ]; then
            mkdir -p ./screenshots
            cp "$PERSIST"/Screenshots/*.png ./screenshots/ 2>/dev/null || true
          fi
        fi

        if [ "$MODE" = "test" ]; then
          SCREENSHOTS_DIR=$(find ~/Library -name "Screenshots" -type d 2>/dev/null | head -1)
          if [ -n "$SCREENSHOTS_DIR" ]; then
            mkdir -p ./screenshots
            cp "$SCREENSHOTS_DIR"/*.png ./screenshots/ 2>/dev/null || true
          fi

          if [ -f "./$RESULT_FILE" ]; then
            FAILURE_COUNT=$(grep -c '<failure' "./$RESULT_FILE" 2>/dev/null || echo "0")
            [ "$FAILURE_COUNT" -gt 0 ] && { echo "ERROR: $FAILURE_COUNT test failure(s)"; exit 1; }
          fi
        fi

        exit ${EXIT_CODE:-0}

    # ----------------------------------------
    # WebGL / WebGPU
    # ----------------------------------------
    - name: Setup Node.js (Web)
      if: inputs.platform == 'WebGL' || inputs.platform == 'WebGPU'
      uses: actions/setup-node@v5
      with:
        node-version: '20'

    - name: Run (Web)
      if: inputs.platform == 'WebGL' || inputs.platform == 'WebGPU'
      shell: bash
      env:
        APP_MODE: ${{ inputs.mode }}
        APP_TIMEOUT: ${{ inputs.timeout }}
        APP_SUITE: ${{ inputs.suite }}
        WEB_GRAPHICS_API: ${{ inputs.platform == 'WebGPU' && 'webgpu' || 'webgl2' }}
      run: |
        set -uo pipefail

        INDEX_HTML=$(find ${{ inputs.build_path }} -name "index.html" | head -1)
        [ -z "$INDEX_HTML" ] && { echo "ERROR: No index.html found"; exit 1; }

        WEBGL_DIR=$(dirname "$INDEX_HTML")
        echo "WebGL directory: $WEBGL_DIR (graphics API: $WEB_GRAPHICS_API)"

        npm init -y > /dev/null
        npm install playwright @playwright/test --silent

        # The hosted runner has no GPU: WebGPU runs on Chromium's SwiftShader Vulkan adapter, which needs an
        # X display, so the browser runs headed under Xvfb.
        RUNNER=()
        if [ "$WEB_GRAPHICS_API" = "webgpu" ]; then
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libvulkan1 mesa-vulkan-drivers
          npx playwright install --with-deps chromium
          RUNNER=(xvfb-run -a --server-args="-screen 0 1920x1080x24")
        else
          npx playwright install chromium
        fi

        openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
          -keyout localhost-key.pem -out localhost.pem \
          -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" 2>/dev/null

        cp localhost*.pem "$WEBGL_DIR/"
        cp Assets/server.js "$WEBGL_DIR/"

        (cd "$WEBGL_DIR" && node server.js) & SERVER_PID=$!

        for i in {1..30}; do
          curl -s -k https://localhost:8080/ -o /dev/null && { echo "Server ready"; break; }
          [ $i -eq 30 ] && { echo "ERROR: Server failed to start"; kill $SERVER_PID 2>/dev/null; exit 1; }
          sleep 1
        done

        "${RUNNER[@]}" npx playwright test --config="${{ github.action_path }}/playwright.config.js" --reporter=list || EXIT_CODE=$?

        kill $SERVER_PID 2>/dev/null || true
        exit ${EXIT_CODE:-0}

    # ----------------------------------------
    # iOS (Fastlane IPA + Firebase Test Lab)
    # ----------------------------------------
    - name: Checkout ci-workflows (iOS)
      if: inputs.platform == 'iOS'
      uses: actions/checkout@v5
      with:
        repository: LightSideKittens/ci-workflows
        token: ${{ env.GH_PAT }}
        sparse-checkout: fastlane
        path: ci-workflows

    - name: Setup Ruby (iOS)
      if: inputs.platform == 'iOS'
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
        working-directory: ci-workflows/fastlane

    - name: Configure Git Credentials (iOS)
      if: inputs.platform == 'iOS'
      shell: bash
      run: |
        git config --global credential.helper store
        echo "https://x-access-token:${{ env.GH_PAT }}@github.com" > ~/.git-credentials

    - name: Build Signed IPA (iOS)
      if: inputs.platform == 'iOS'
      shell: bash
      env:
        MATCH_PASSWORD: ${{ env.MATCH_PASSWORD }}
        MATCH_GIT_URL: ${{ env.MATCH_GIT_URL }}
        APP_IDENTIFIER: ${{ env.APP_IDENTIFIER }}
        TEAM_ID: ${{ env.TEAM_ID }}
        APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ env.APP_STORE_CONNECT_KEY_ID }}
        APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ env.APP_STORE_CONNECT_ISSUER_ID }}
        APP_STORE_CONNECT_API_KEY_KEY: ${{ env.APP_STORE_CONNECT_API_KEY }}
      run: |
        set -euo pipefail

        XCODEPROJ=$(find ${{ inputs.build_path }} -name "*.xcodeproj" | head -1)
        [ -z "$XCODEPROJ" ] && { echo "ERROR: No .xcodeproj found"; exit 1; }
        echo "Xcode project: $XCODEPROJ"

        PROJECT_DIR=$(dirname "$XCODEPROJ")
        find "$PROJECT_DIR" -name "*.sh" -exec chmod +x {} \;
        find "$PROJECT_DIR" -name "usymtool*" -exec chmod +x {} \;

        cd ci-workflows/fastlane
        bundle install --quiet
        bundle exec fastlane build_ipa \
          xcode_project:"$GITHUB_WORKSPACE/$XCODEPROJ" \
          output_name:"UniText.ipa" \
          output_dir:"$GITHUB_WORKSPACE"

        [ ! -f "$GITHUB_WORKSPACE/UniText.app.dSYM.zip" ] && {
          echo "::error title=Missing iOS debug symbols::Fastlane did not produce UniText.app.dSYM.zip"
          exit 1
        }
        ls -lh "$GITHUB_WORKSPACE/UniText.ipa" "$GITHUB_WORKSPACE/UniText.app.dSYM.zip"

    - name: Launch on Firebase (iOS)
      if: inputs.platform == 'iOS'
      shell: bash
      env:
        APP_TIMEOUT: ${{ inputs.timeout }}
        APP_MODE: ${{ inputs.mode }}
        APP_SUITE: ${{ inputs.suite }}
      run: |
        set -uo pipefail
        IPA="$GITHUB_WORKSPACE/UniText.ipa"
        [ ! -f "$IPA" ] && { echo "ERROR: IPA not found"; exit 1; }

        TIMEOUT_MINUTES=$((APP_TIMEOUT / 60))
        [ $TIMEOUT_MINUTES -lt 5 ] && TIMEOUT_MINUTES=10
        FIREBASE_WAIT_SECONDS=$((APP_TIMEOUT + 600))

        # Game-loop scenario = benchmark suite: 1 = all, 2 = text pipeline, 3 = glyph rasterization, 4 = motion.
        SCENARIO=1
        if [ "$APP_MODE" = "benchmark" ]; then
          case "$APP_SUITE" in
            text) SCENARIO=2 ;;
            glyph) SCENARIO=3 ;;
            motion) SCENARIO=4 ;;
          esac
        fi
        echo "Scenario: $SCENARIO (mode=$APP_MODE suite=$APP_SUITE)"

        RESULTS_DIR="${{ inputs.platform }}-${{ inputs.mode }}-${{ inputs.unity_version }}-${{ github.run_id }}"
        echo "FIREBASE_RESULTS_DIR=$RESULTS_DIR" >> $GITHUB_ENV

        command -v gtimeout >/dev/null 2>&1 || brew install coreutils
        set +e
        # The iOS 16 device is the matrix's only source of a screen recording, and therefore of the
        # soft-keyboard frames: Test Lab returns no video for iOS 18+.
        gtimeout --signal=INT --kill-after=30s "${FIREBASE_WAIT_SECONDS}s" \
          gcloud beta firebase test ios run \
          --type game-loop \
          --app "$IPA" \
          --device model=iphone14pro,version=16.6 \
          --device model=iphone16pro,version=18.3 \
          --device model=iphonese3,version=26.3 \
          --scenario-numbers=$SCENARIO \
          --timeout "${TIMEOUT_MINUTES}m" \
          --results-bucket="$FIREBASE_RESULTS_BUCKET" \
          --results-dir="$RESULTS_DIR" 2>&1 | tee firebase_output.log
        FIREBASE_EXIT_CODE=${PIPESTATUS[0]}
        set -e
        if [ "$FIREBASE_EXIT_CODE" -eq 124 ]; then
          echo "::warning::Firebase matrix wait exceeded ${FIREBASE_WAIT_SECONDS}s; collecting completed device results"
          FIREBASE_EXIT_CODE=0
        elif [ "$FIREBASE_EXIT_CODE" -ne 0 ]; then
          echo "Firebase exit code: $FIREBASE_EXIT_CODE"
        fi
        exit "$FIREBASE_EXIT_CODE"

    - name: Launch on Firebase (Android)
      if: inputs.platform == 'Android'
      shell: bash
      env:
        APP_TIMEOUT: ${{ inputs.timeout }}
        APP_MODE: ${{ inputs.mode }}
        APP_SUITE: ${{ inputs.suite }}
        LEGACY_ANDROID_DEVICES: ${{ inputs.legacy_android_devices }}
      run: |
        set -uo pipefail
        APK=$(find ${{ inputs.build_path }} -name "*.apk" | head -1)
        [ -z "$APK" ] && { echo "ERROR: No .apk found"; exit 1; }
        echo "APK: $APK"

        TIMEOUT_MINUTES=$((APP_TIMEOUT / 60))
        [ $TIMEOUT_MINUTES -lt 5 ] && TIMEOUT_MINUTES=10
        FIREBASE_WAIT_SECONDS=$((APP_TIMEOUT + 600))

        # Game-loop scenario = benchmark suite: 1 = all, 2 = text pipeline, 3 = glyph rasterization, 4 = motion.
        SCENARIO=1
        if [ "$APP_MODE" = "benchmark" ]; then
          case "$APP_SUITE" in
            text) SCENARIO=2 ;;
            glyph) SCENARIO=3 ;;
            motion) SCENARIO=4 ;;
          esac
        fi
        echo "Scenario: $SCENARIO (mode=$APP_MODE suite=$APP_SUITE)"

        RESULTS_DIR="${{ inputs.platform }}-${{ inputs.mode }}-${{ inputs.unity_version }}-${{ github.run_id }}"
        echo "FIREBASE_RESULTS_DIR=$RESULTS_DIR" >> $GITHUB_ENV

        if [ "$LEGACY_ANDROID_DEVICES" = "true" ]; then
          DEVICES=(
            --device model=RMX3231,version=30
            --device model=aruba,version=30
            --device model=TECNO-BF6,version=31
          )
        else
          DEVICES=(
            --device model=shiba,version=34
            --device model=dm3q,version=34
            --device model=frankel,version=36
            --device model=pa3q,version=35
            --device model=a06,version=35
            --device model=SH-01L,version=28
          )
        fi

        set +e
        timeout --signal=INT --kill-after=30s "${FIREBASE_WAIT_SECONDS}s" \
          gcloud firebase test android run \
          --type game-loop \
          --app "$APK" \
          "${DEVICES[@]}" \
          --scenario-numbers=$SCENARIO \
          --timeout "${TIMEOUT_MINUTES}m" \
          --results-bucket="$FIREBASE_RESULTS_BUCKET" \
          --results-dir="$RESULTS_DIR" 2>&1 | tee firebase_output.log
        FIREBASE_EXIT_CODE=${PIPESTATUS[0]}
        set -e
        if [ "$FIREBASE_EXIT_CODE" -eq 124 ]; then
          echo "::warning::Firebase matrix wait exceeded ${FIREBASE_WAIT_SECONDS}s; collecting completed device results"
          FIREBASE_EXIT_CODE=0
        elif [ "$FIREBASE_EXIT_CODE" -ne 0 ]; then
          echo "Firebase exit code: $FIREBASE_EXIT_CODE"
        fi
        exit "$FIREBASE_EXIT_CODE"

    - name: Collect Firebase Results
      if: always() && (inputs.platform == 'Android' || inputs.platform == 'iOS')
      shell: bash
      env:
        APP_MODE: ${{ inputs.mode }}
        SCREEN_RECORDING: ${{ inputs.screen_recording }}
      run: |
        set -uo pipefail

        mkdir -p firebase-results
        gsutil -m rsync -r "gs://$FIREBASE_RESULTS_BUCKET/$FIREBASE_RESULTS_DIR/" ./firebase-results/ 2>/dev/null || true

        echo "=== Firebase results ==="
        find ./firebase-results -type f 2>/dev/null | head -50

        echo "=== Firebase device logs (full) ==="
        find ./firebase-results \( -name "logcat" -o -name "*.txt" -o -name "*.log" -o -name "syslog*" \) -type f 2>/dev/null | while read -r f; do
          echo "----- $f -----"; cat "$f" 2>/dev/null || true
        done

        if [ "$SCREEN_RECORDING" = "true" ]; then
          find ./firebase-results -type f \( -iname '*.mp4' -o -iname '*.mov' \) 2>/dev/null | while read -r v; do
            REL="${v#./firebase-results/}"
            DEV="${REL%%/*}"
            mkdir -p "screen-recording/$DEV"
            mv -f "$v" "screen-recording/$DEV/$(basename "$v")"
          done
          echo "=== device screen recordings ==="
          find screen-recording -type f 2>/dev/null || echo "  (none)"
        fi

        find ./firebase-results -type f \( -iname '*.ipa' -o -iname '*.apk' -o -iname '*.aab' -o -iname '*.mp4' -o -iname '*.mov' \) -delete 2>/dev/null || true
        rm -rf ./firebase-results/*.app 2>/dev/null || true

        UNPACK_ID=0
        for f in $(find ./firebase-results -type f 2>/dev/null); do
          if unzip -tqq "$f" </dev/null >/dev/null 2>&1; then
            UNPACK_ID=$((UNPACK_ID + 1))
            PDIR=$(dirname "$f")
            DEV=$(basename "$(dirname "$PDIR")")
            if [ "$DEV" = "firebase-results" ] || [ "$DEV" = "." ]; then DEV=$(basename "$PDIR"); fi
            DEST="./firebase-results/unpacked/bundle-${UNPACK_ID}-${DEV}"
            echo "Unpacking bundle: $f -> $DEST"
            mkdir -p "$DEST"
            unzip -o "$f" -d "$DEST" </dev/null || echo "unzip failed (rc=$?), trying python zipfile"
            [ -e "$DEST" ] || python3 -m zipfile -e "$f" "$DEST" || echo "python zipfile also failed (rc=$?)"
            echo "--- unpacked contents of $DEST:"
            find "$DEST" -type f 2>/dev/null | head -8 || true
          fi
        done

        mkdir -p screenshots
        find ./firebase-results -iname '*.png' -type f 2>/dev/null | while read -r p; do
          REL="${p#./firebase-results/}"
          DEV="${REL%%/*}"
          if [ "$DEV" = "unpacked" ]; then
            DEV=$(echo "$REL" | cut -d/ -f2 | sed 's/^bundle-[0-9]*-//')
          fi
          mkdir -p "screenshots/$DEV"
          cp -f "$p" "screenshots/$DEV/$(basename "$p")" 2>/dev/null || true
        done

        BUCKET_URL="https://storage.googleapis.com/${FIREBASE_RESULTS_BUCKET}/${FIREBASE_RESULTS_DIR}/"
        printf '%s\n' "$BUCKET_URL" > firebase-results-url.txt
        echo "=== Firebase results (browsable): $BUCKET_URL ==="
        echo "=== crash reports present in bucket ==="
        find ./firebase-results \( -iname '*.ips' -o -iname 'tombstone*' \) -type f 2>/dev/null \
          | sed 's#^\./firebase-results/#  #' || echo "  (none)"

        APP_CRASHES=$(find ./firebase-results -path '*/CrashLogs/UniText-*.ips' -type f 2>/dev/null || true)
        if [ -n "$APP_CRASHES" ]; then
          while IFS= read -r CRASH; do
            echo "::error title=Application crash::${CRASH#./firebase-results/}"
          done <<< "$APP_CRASHES"
          exit 1
        fi

        RESULT_FILES=$(find ./firebase-results \( -name "benchmarkResults.json" -o -name "results_scenario_*.json" -o -name "testResults.xml" \) -type f 2>/dev/null || true)

        if [ -z "$RESULT_FILES" ]; then
          echo "ERROR: No result files found in Firebase results"; exit 1
        fi

        echo "=== Found result files ==="
        echo "$RESULT_FILES"

        if [ "$APP_MODE" = "benchmark" ]; then
          BENCH_FILES=$(echo "$RESULT_FILES" | grep "benchmarkResults\.json" || true)
          if [ -z "$BENCH_FILES" ]; then
            BENCH_FILES=$(echo "$RESULT_FILES" | grep -E "results_scenario_" || true)
          fi
          if [ -z "$BENCH_FILES" ]; then echo "ERROR: No benchmark results found"; exit 1; fi
          DIDX=0
          for R in $BENCH_FILES; do
            if ! head -c1 "$R" | grep -q '{'; then echo "Skipping non-JSON payload: $R"; continue; fi
            DIDX=$((DIDX + 1))
            REL="${R#./firebase-results/}"
            DNAME="${REL%%/*}"
            if [ "$DNAME" = "unpacked" ]; then
              DNAME=$(echo "$REL" | cut -d/ -f2 | sed 's/^bundle-[0-9]*-//')
            fi
            [ -f ./benchmarkResults.json ] || cp "$R" ./benchmarkResults.json
            cp "$R" "./benchmarkResults_${DIDX}_${DNAME}.json" 2>/dev/null || true
          done
          if [ "$DIDX" = "0" ]; then echo "ERROR: No valid JSON benchmark results — all device payloads were empty or binary"; exit 1; fi

          mkdir -p benchmark-streams
          find ./firebase-results -name "run-*.js" -type f -exec cp -f {} ./benchmark-streams/ \; 2>/dev/null || true

          mkdir -p device-logs
          find ./firebase-results -path "*/logs/*.log" -type f 2>/dev/null | while read -r L; do
            cp -f "$L" "./device-logs/$(basename "$(dirname "$(dirname "$L")")")-$(basename "$L")" 2>/dev/null || true
          done
        else
          TEST_FILES=$(echo "$RESULT_FILES" | grep -E "testResults\.xml|results_scenario_" || true)
          if [ -z "$TEST_FILES" ]; then echo "ERROR: No test results found"; exit 1; fi
          python3 "$GITHUB_WORKSPACE/.github/scripts/merge-test-results.py" \
            testResults.xml $TEST_FILES
        fi

