name: Tracker sync

on:
  push:
    paths:
      - .github/tracker.json
      - .github/ISSUE_TEMPLATE/**
      - .github/scripts/tracker.py
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: tracker-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check issue forms against the registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the tracker registry
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github

      - name: Compare generated forms
        run: python3 .github/scripts/tracker.py check

  labels:
    name: Sync labels
    needs: check
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the tracker registry
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github

      - name: Apply the registry to repository labels
        run: python3 .github/scripts/tracker.py labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
