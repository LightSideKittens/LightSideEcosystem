name: Check Asset Store credentials

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Unity Asset Store session
        env:
          ASSET_STORE_SESSION: ${{ secrets.ASSET_STORE_SESSION }}
        run: node Tools/assetstore/kharma.js packages

      - name: Unity China session
        if: always()
        env:
          CN_ASSET_STORE_COOKIE: ${{ secrets.CN_ASSET_STORE_COOKIE }}
        run: node Tools/assetstore/cn.js packages
