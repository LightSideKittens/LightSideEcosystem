name: Publish to Asset Store

on:
  repository_dispatch:
    types: [unitext-released]
  workflow_dispatch:
    inputs:
      version:
        description: "Released UniText version, without the leading v (e.g. 3.9.0)"
        required: true
      dry_run:
        description: "Build and validate the package, but do not upload"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      artifact: ${{ steps.meta.outputs.artifact }}
      file: ${{ steps.meta.outputs.file }}
    steps:
      - name: Resolve version
        id: meta
        shell: bash
        run: |
          VERSION="${{ github.event.client_payload.version || inputs.version }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "No version supplied."
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "artifact=UniText-$VERSION-unitypackage"
            echo "file=UniText-$VERSION.unitypackage"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Pin UniText to the released tag
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          cd Packages/media.lightside.unitext
          git fetch --depth 1 origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
          git checkout --force "v$VERSION"

          MANIFEST_VERSION=$(node -p "require('./package.json').version")
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "Tag v$VERSION carries package.json version $MANIFEST_VERSION."
            exit 1
          fi

          echo "UniText pinned to v$VERSION ($(git rev-parse --short HEAD))"

      - name: Pin LightSide.Core to the version UniText declares
        shell: bash
        run: |
          CORE_VERSION=$(node -p "require('./Packages/media.lightside.unitext/package.json').dependencies['media.lightside.core']")
          if [ -z "$CORE_VERSION" ] || [ "$CORE_VERSION" = "undefined" ]; then
            echo "UniText does not declare a media.lightside.core dependency."
            exit 1
          fi

          cd Packages/media.lightside.core
          git fetch --depth 1 origin "refs/tags/v$CORE_VERSION:refs/tags/v$CORE_VERSION"
          git checkout --force "v$CORE_VERSION"

          BUNDLED=$(node -p "require('./package.json').version")
          if [ "$BUNDLED" != "$CORE_VERSION" ]; then
            echo "Tag v$CORE_VERSION of LightSide.Core carries package.json version $BUNDLED."
            exit 1
          fi

          echo "LightSide.Core pinned to v$CORE_VERSION ($(git rev-parse --short HEAD))"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Apply the Asset Store transform
        run: node Tools/assetstore/transform.js Packages/media.lightside.unitext Packages/media.lightside.core

      - name: Build the .unitypackage
        run: |
          node Tools/assetstore/pack.js build \
            --out "Builds/AssetStore/${{ steps.meta.outputs.file }}" \
            --include Packages/media.lightside.unitext \
            --include Packages/media.lightside.core

      - name: Attach the .unitypackage to this run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: Builds/AssetStore/${{ steps.meta.outputs.file }}
          retention-days: 30
          compression-level: 0
          overwrite: true

  asset-store:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Upload to the Asset Store draft
        env:
          ASSET_STORE_SESSION: ${{ secrets.ASSET_STORE_SESSION }}
        run: |
          node Tools/assetstore/kharma.js upload \
            --package-id 357844 \
            --root-package media.lightside.unitext \
            --file "dist/${{ needs.build.outputs.file }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

  unity-china:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Upload to the Unity China Asset Store draft
        env:
          CN_ASSET_STORE_COOKIE: ${{ secrets.CN_ASSET_STORE_COOKIE }}
        run: |
          node Tools/assetstore/cn.js upload \
            --package-id 20006098 \
            --file "dist/${{ needs.build.outputs.file }}" \
            --tuanjie-version 1.10.3 \
            --unity-version 2022.3.62f3c1 \
            ${{ inputs.dry_run && '--dry-run' || '' }}
