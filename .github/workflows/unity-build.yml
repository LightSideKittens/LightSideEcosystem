name: Unity Build & Test 
run-name: "🔨 ${{ (inputs.win64 && inputs.linux && inputs.macos && inputs.android && inputs.ios && inputs.webgl) && '🌍 All platforms ' || format('{0}{1}{2}{3}{4}{5}', inputs.win64 && '🪟 Win64 ' || '', inputs.linux && '🐧 Linux ' || '', inputs.macos && '🍎 macOS ' || '', inputs.android && '🤖 Android ' || '', inputs.ios && '📱 iOS ' || '', inputs.webgl && '🌐 WebGL ' || '') }}• ${{ (inputs.unity_2022 && inputs.unity_6 && inputs.unity_6_latest) && '🎮 All versions ' || format('{0}{1}{2}', inputs.unity_2022 && '🎮 2022 ' || '', inputs.unity_6 && '🎮 6000 ' || '', inputs.unity_6_latest && '🎮 6000-latest ' || '') }}${{ inputs.slideshow && '• 🎞️ Slideshow' || inputs.run_tests && '• 🧪 Tests' || '' }}${{ inputs.leave_unitext_only && ' • UniText Only' || '' }}"

on:
  workflow_dispatch:
    inputs:
      # Unity Versions (minimum supported: 2022.3 LTS)
      unity_2022:
        description: '🎮 Unity 2022'
        type: boolean
        default: true
      unity_6:
        description: '🎮 Unity 6000ㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤ'
        type: boolean
        default: false
      unity_6_latest:
        description: '🎮 Unity 6000 latest (GameCI: 6000.5.8f1)ㅤㅤㅤㅤㅤㅤㅤㅤ'
        type: boolean
        default: false

      # Platforms
      win64:
        description: '🪟 Windows x64'
        type: boolean
        default: false
      linux:
        description: '🐧 Linux x64'
        type: boolean
        default: false
      macos:
        description: '🍎 macOS'
        type: boolean
        default: false
      android:
        description: '🤖 Android'
        type: boolean
        default: false
      ios:
        description: '📱 iOS'
        type: boolean
        default: false
      webgl:
        description: '🌐 WebGLㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤ'
        type: boolean
        default: false

      # Options
      leave_unitext_only:
        description: 'Leave UniText Only (keeps Core and test infrastructure)'
        type: boolean
        default: true
      debug:
        description: '🐛 Debug'
        type: boolean
        default: true
      benchmark:
        description: '📊 Benchmark suite'
        type: choice
        options:
          - none
          - all
          - text
          - glyph
        default: none
      run_tests:
        description: '🧪 Run tests'
        type: boolean
        default: false
      legacy_android_devices:
        description: '📟 Affected legacy Android devices (3 instead of standard 6)'
        type: boolean
        default: false
      slideshow:
        description: '🎞️ Slideshow screenshots (BasicUsage sample, overrides tests)'
        type: boolean
        default: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          VERSIONS="["
          FIRST_V=true
          ${{ inputs.unity_2022 }} && { $FIRST_V || VERSIONS+=","; VERSIONS+="\"2022.3.62f2\""; FIRST_V=false; }
          # GameCI publishes images only for final (fXX) Unity releases — no alpha/beta.
          # Latest available 6000.x is tracked at https://hub.docker.com/r/unityci/editor/tags
          ${{ inputs.unity_6 }} && { $FIRST_V || VERSIONS+=","; VERSIONS+="\"6000.3.14f1\""; FIRST_V=false; }
          ${{ inputs.unity_6_latest }} && { $FIRST_V || VERSIONS+=","; VERSIONS+="\"6000.5.8f1\""; FIRST_V=false; }
          VERSIONS+="]"

          PLATFORMS="["
          FIRST_P=true
          ${{ inputs.win64 }} && { $FIRST_P || PLATFORMS+=","; PLATFORMS+="\"StandaloneWindows64\""; FIRST_P=false; }
          ${{ inputs.linux }} && { $FIRST_P || PLATFORMS+=","; PLATFORMS+="\"StandaloneLinux64\""; FIRST_P=false; }
          ${{ inputs.macos }} && { $FIRST_P || PLATFORMS+=","; PLATFORMS+="\"StandaloneOSX\""; FIRST_P=false; }
          ${{ inputs.android }} && { $FIRST_P || PLATFORMS+=","; PLATFORMS+="\"Android\""; FIRST_P=false; }
          ${{ inputs.ios }} && { $FIRST_P || PLATFORMS+=","; PLATFORMS+="\"iOS\""; FIRST_P=false; }
          ${{ inputs.webgl }} && { $FIRST_P || PLATFORMS+=","; PLATFORMS+="\"WebGL\""; FIRST_P=false; }
          PLATFORMS+="]"

          # Default to Win64 + Unity 2022 if nothing selected
          [ "$VERSIONS" = "[]" ] && VERSIONS='["2022.3.62f2"]'
          [ "$PLATFORMS" = "[]" ] && PLATFORMS='["StandaloneWindows64"]'

          MATRIX="{\"unity_version\": $VERSIONS, \"platform\": $PLATFORMS}"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build-and-test:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    uses: ./.github/workflows/build-and-test.yml
    with:
      unity_version: ${{ matrix.unity_version }}
      platform: ${{ matrix.platform }}
      debug: ${{ inputs.debug == true }}
      benchmark: ${{ inputs.benchmark }}
      run_tests: ${{ inputs.run_tests == true }}
      legacy_android_devices: ${{ inputs.legacy_android_devices }}
      slideshow: ${{ inputs.slideshow == true }}
      leave_unitext_only: ${{ inputs.leave_unitext_only }}
    secrets: inherit

  finalize-benchmarks:
    needs: build-and-test
    if: always() && inputs.benchmark != 'none'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      - name: Download all benchmark artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: BenchmarkResults-*
          path: all-artifacts

      - name: Assemble per-platform viewer archives
        shell: bash
        run: |
          python3 .github/scripts/assemble-benchmark-archives.py all-artifacts viewer-archives
          echo "=== assembled archives ==="
          ls -la viewer-archives 2>/dev/null || echo "(none)"

      - name: Upload per-platform viewer archives
        uses: actions/upload-artifact@v6
        with:
          name: BenchmarkViewer-${{ inputs.benchmark }}
          path: viewer-archives/
          if-no-files-found: warn
          retention-days: 30
