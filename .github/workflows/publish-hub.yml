name: Publish Hub

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Resolve Hub revision
        id: hub
        run: echo "revision=$(git rev-parse HEAD:Packages/media.lightside.hub)" >> "$GITHUB_OUTPUT"
      - name: Check out Hub sources
        uses: actions/checkout@v5
        with:
          repository: LightSideKittens/media.lightside.hub
          ref: ${{ steps.hub.outputs.revision }}
          path: Packages/media.lightside.hub
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
      - name: Package Hub assets
        run: python3 Packages/media.lightside.hub/Tools~/package_release.py "$GITHUB_REF_NAME" "$RUNNER_TEMP/LightSideHub.unitypackage"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/LightSideHub.unitypackage" \
            --verify-tag --title "LightSide Hub ${GITHUB_REF_NAME#v}" \
            --generate-notes "${flags[@]}"
