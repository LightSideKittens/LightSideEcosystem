name: Build and Test (Reusable)❤️ 

on:
  workflow_call:
    inputs:
      unity_version:
        required: true
        type: string
      platform:
        required: true
        type: string
      debug:
        required: false
        type: boolean
        default: true
      benchmark:
        description: "Benchmark suite: none, all, text (pipeline), glyph (rasterization) or motion"
        required: false
        type: string
        default: 'none'
      run_tests:
        required: false
        type: boolean
        default: false
      legacy_android_devices:
        required: false
        type: boolean
        default: false
      slideshow:
        description: "Capture a screenshot of every BasicUsage sample slide instead of running tests (mutually exclusive with tests/benchmark; the build carries the sample scene)"
        required: false
        type: boolean
        default: false
      leave_unitext_only:
        description: 'Build with UniText, its dependencies and the shared test infrastructure only'
        required: false
        type: boolean
        default: false
      test_timeout:
        required: false
        type: number
        default: 300
      benchmark_timeout:
        description: "Benchmarks run every engine x variant x font x iteration — far longer than tests (WebGL single-threaded wasm alone exceeds 300s)"
        required: false
        type: number
        default: 1800

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          lfs: true
          submodules: recursive

      - name: Setup .NET for LightSide state code generation
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build LightSide state source generator
        shell: bash
        run: |
          dotnet build Packages/media.lightside.core/Tools~/StateCodeGen/LightSide.StateCodeGen.csproj --configuration Release
          test -f Packages/media.lightside.core/Analyzers/LightSide.StateCodeGen.dll
          test ! -f Packages/media.lightside.core/Analyzers/LightSide.StateCodeGen.deps.json

      - name: Apply CI package manifest
        shell: bash
        run: |
          cp .github/ci/Packages/manifest.json Packages/manifest.json
          # Addressables 1.x calls SBP 2.6.1's broken CreateBuiltInShadersBundle wrapper; Unity 6000.x
          # editors force SBP 2.6.1, so they must pair it with Addressables 2.x (needs Unity 2023.1+,
          # so the 2022.3 jobs keep the 1.x pin from the manifest).
          if [[ "${{ inputs.unity_version }}" == 6000.* ]]; then
            jq '.dependencies["com.unity.addressables"] = "2.9.1"' Packages/manifest.json > Packages/manifest.json.tmp
            mv Packages/manifest.json.tmp Packages/manifest.json
          fi
          rm -f Packages/packages-lock.json
          rm -rf Packages/media.lightside.promo

      - name: Leave UniText Only
        if: inputs.leave_unitext_only
        shell: bash
        env:
          CI_BENCHMARK_SUITE: ${{ inputs.benchmark }}
        run: python3 .github/scripts/prepare-unitext-only.py

      - name: Cache Library
        uses: actions/cache@v5
        with:
          path: Library
          key: Library-v3-${{ inputs.leave_unitext_only }}-${{ inputs.platform }}-${{ inputs.unity_version }}-${{ inputs.debug }}-${{ inputs.benchmark }}-${{ inputs.run_tests }}-${{ inputs.slideshow }}-${{ hashFiles('Assets/**/Plugins/**', 'Assets/**/*.jslib', 'Assets/**/*.jslib.meta', 'Assets/**/*.asmdef', 'Assets/**/*.asmdef.meta', 'Assets/**/*.asmref', 'Assets/**/*.asmref.meta', 'Assets/**/*.rsp', 'Assets/**/*.rsp.meta', '.github/ci/Packages/**', 'Packages/**', 'ProjectSettings/**') }}-${{ hashFiles('Assets/**', '.github/ci/Packages/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-v3-${{ inputs.leave_unitext_only }}-${{ inputs.platform }}-${{ inputs.unity_version }}-${{ inputs.debug }}-${{ inputs.benchmark }}-${{ inputs.run_tests }}-${{ inputs.slideshow }}-${{ hashFiles('Assets/**/Plugins/**', 'Assets/**/*.jslib', 'Assets/**/*.jslib.meta', 'Assets/**/*.asmdef', 'Assets/**/*.asmdef.meta', 'Assets/**/*.asmref', 'Assets/**/*.asmref.meta', 'Assets/**/*.rsp', 'Assets/**/*.rsp.meta', '.github/ci/Packages/**', 'Packages/**', 'ProjectSettings/**') }}-
            Library-v3-${{ inputs.leave_unitext_only }}-${{ inputs.platform }}-${{ inputs.unity_version }}-${{ inputs.debug }}-${{ inputs.benchmark }}-${{ inputs.run_tests }}-${{ inputs.slideshow }}-
            Library-v3-${{ inputs.leave_unitext_only }}-${{ inputs.platform }}-${{ inputs.unity_version }}-
            Library-v3-${{ inputs.leave_unitext_only }}-${{ inputs.platform }}-

      - name: "${{ inputs.platform == 'iOS' && 'Generate Xcode Project (not Xcode build)' || 'Build' }}"
        timeout-minutes: 60
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          IL2CPP_ADDITIONAL_ARGS: --compiler-flags=-j8
        with:
          unityVersion: ${{ inputs.unity_version }}
          targetPlatform: ${{ inputs.platform }}
          androidSymbolType: ${{ inputs.platform == 'Android' && 'public' || 'none' }}
          allowDirtyBuild: true
          customParameters: -ciDebug ${{ inputs.benchmark == 'none' && inputs.debug || false }} -ciBenchmark ${{ inputs.benchmark != 'none' }} -ciBenchmarkSuite ${{ inputs.benchmark }} -ciTests ${{ inputs.run_tests }} -ciSlideshow ${{ inputs.slideshow }} -ciUniTextOnly ${{ inputs.leave_unitext_only }} ${{ inputs.benchmark != 'none' && '-Development' || '' }}

      - name: Upload WebGL Compiler Diagnostics
        if: failure() && inputs.platform == 'WebGL'
        uses: actions/upload-artifact@v6
        with:
          name: WebGL-CompilerDiagnostics-${{ inputs.unity_version }}
          path: |
            Logs/Clang/
            Library/Bee/artifacts/WebGL/il2cppOutput/cpp/LightSide.MoveIt*.cpp
          retention-days: 7

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Build-${{ inputs.unity_version }}-${{ inputs.platform }}
          path: build
          retention-days: 7

  test:
    name: test
    if: inputs.run_tests || inputs.slideshow
    needs: build
    timeout-minutes: 45
    runs-on: ${{
      inputs.platform == 'StandaloneWindows64' && 'windows-latest' ||
      inputs.platform == 'StandaloneOSX' && 'macos-26' ||
      inputs.platform == 'iOS' && 'macos-26' ||
      'ubuntu-latest'
      }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          sparse-checkout: |
            .github/actions
            .github/scripts
            Assets/server.js

      - name: Download Build Artifact
        uses: actions/download-artifact@v7
        with:
          name: Build-${{ inputs.unity_version }}-${{ inputs.platform }}
          path: build

      - name: Authenticate to Google Cloud (Android/iOS)
        if: inputs.platform == 'Android' || inputs.platform == 'iOS'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Setup Google Cloud SDK (Android/iOS)
        if: inputs.platform == 'Android' || inputs.platform == 'iOS'
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Install gcloud beta (iOS)
        if: inputs.platform == 'iOS'
        run: gcloud components install beta --quiet

      - name: Run Tests
        uses: ./.github/actions/run-app
        env:
          FIREBASE_RESULTS_BUCKET: ${{ secrets.FIREBASE_RESULTS_BUCKET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        with:
          platform: ${{ inputs.platform }}
          mode: test
          unity_version: ${{ inputs.unity_version }}
          timeout: ${{ inputs.test_timeout }}
          legacy_android_devices: ${{ inputs.legacy_android_devices }}
          screen_recording: ${{ inputs.slideshow }}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.slideshow && 'Slideshow' || 'TestResults' }}-${{ inputs.unity_version }}-${{ inputs.platform }}
          path: |
            testResults.xml
            *.log
            *.dSYM.zip
            ${{ inputs.slideshow && '!screenshots/**' || 'screenshots/' }}
            firebase-results/
            firebase-results-url.txt
          retention-days: 7

      - name: Upload Slideshow Screenshots
        if: always() && inputs.slideshow
        uses: actions/upload-artifact@v6
        with:
          name: SlideshowScreenshots-${{ inputs.unity_version }}-${{ inputs.platform }}
          path: screenshots/
          retention-days: 7

      # Device screen recording: the only artifact that carries the OS-owned layers — the soft
      # keyboard, status and navigation bars — which no in-player capture reaches on any platform.
      - name: Upload Slideshow Screen Recording
        if: always() && inputs.slideshow && (inputs.platform == 'Android' || inputs.platform == 'iOS')
        uses: actions/upload-artifact@v6
        with:
          name: SlideshowRecording-${{ inputs.unity_version }}-${{ inputs.platform }}
          path: screen-recording/
          if-no-files-found: warn
          retention-days: 7

      - name: Test Summary
        if: always()
        shell: bash
        run: |
          echo "### ${{ inputs.slideshow && '🎞️ Slideshow' || '🧪 Test Results' }}: ${{ inputs.platform }} (${{ inputs.unity_version }})" >> $GITHUB_STEP_SUMMARY
          if [ ! -f testResults.xml ]; then
            echo "❌ No test results found" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          TOTAL=$(grep -c '<testcase' testResults.xml || true)
          FAILED=$(grep -c '<failure' testResults.xml || true)
          PASSED=$((TOTAL - FAILED))
          if [ "$FAILED" -gt 0 ]; then ICON="❌"; else ICON="✅"; fi
          echo "$ICON Passed: $PASSED / $TOTAL" >> $GITHUB_STEP_SUMMARY
          if [ "$FAILED" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Failed: $FAILED" >> $GITHUB_STEP_SUMMARY
          fi

  benchmark:
    if: inputs.benchmark != 'none' && inputs.platform != 'StandaloneLinux64'
    needs: build
    timeout-minutes: 45
    runs-on: ${{
      inputs.platform == 'StandaloneWindows64' && 'windows-latest' ||
      inputs.platform == 'StandaloneOSX' && 'macos-26' ||
      inputs.platform == 'iOS' && 'macos-26' ||
      'ubuntu-latest'
      }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          sparse-checkout: |
            .github/actions
            .github/scripts
            Assets/server.js

      - name: Download Build Artifact
        uses: actions/download-artifact@v7
        with:
          name: Build-${{ inputs.unity_version }}-${{ inputs.platform }}
          path: build

      - name: Authenticate to Google Cloud (Android/iOS)
        if: inputs.platform == 'Android' || inputs.platform == 'iOS'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Setup Google Cloud SDK (Android/iOS)
        if: inputs.platform == 'Android' || inputs.platform == 'iOS'
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Install gcloud beta (iOS)
        if: inputs.platform == 'iOS'
        run: gcloud components install beta --quiet

      - name: Run Benchmarks
        uses: ./.github/actions/run-app
        env:
          FIREBASE_RESULTS_BUCKET: ${{ secrets.FIREBASE_RESULTS_BUCKET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        with:
          platform: ${{ inputs.platform }}
          mode: benchmark
          suite: ${{ inputs.benchmark }}
          unity_version: ${{ inputs.unity_version }}
          timeout: ${{ inputs.benchmark_timeout }}
          legacy_android_devices: ${{ inputs.legacy_android_devices }}

      - name: Emit viewer site streams
        if: always()
        shell: bash
        run: |
          # Every result JSON (multi-device runs produce benchmarkResults_<n>_<device>.json) becomes
          # its own set of run-{text|glyph|motion}-*.js drop-ins; device-emitted streams collected by
          # run-app already sit in benchmark-streams/ and are kept as-is. The plain
          # benchmarkResults.json is a copy of the first device file, so it is only converted when
          # no per-device files exist (desktop runs).
          FILES=$(ls benchmarkResults_*.json 2>/dev/null || true)
          [ -z "$FILES" ] && [ -f benchmarkResults.json ] && FILES="benchmarkResults.json"
          for f in $FILES; do
            python3 .github/scripts/benchmark-summary.py \
              "$f" \
              --commit "${{ github.sha }}" \
              --branch "${{ github.ref_name }}" \
              --streams-dir benchmark-streams || true
          done

      - name: Upload Benchmark Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: BenchmarkResults-${{ inputs.benchmark }}-${{ inputs.unity_version }}-${{ inputs.platform }}
          path: |
            benchmarkResults*.json
            *.dSYM.zip
            benchmark-streams/
            screenshots/
            device-logs/
            firebase-results/
            firebase-results-url.txt
            firebase_output.log
            benchmark.log
          retention-days: 30

      - name: Benchmark Summary
        if: always()
        shell: bash
        run: |
          # Stream splitting is shared; the rendered tables are the suite's own, so motion has its
          # own renderer and never widens the text/glyph one.
          if [ -f benchmarkResults.json ] && [ "${{ inputs.benchmark }}" = "motion" ]; then
            python3 .github/scripts/moveit-benchmark-summary.py \
              benchmarkResults.json \
              >> $GITHUB_STEP_SUMMARY
          elif [ -f benchmarkResults.json ]; then
            python3 .github/scripts/benchmark-summary.py \
              benchmarkResults.json \
              --commit "${{ github.sha }}" \
              --branch "${{ github.ref_name }}" \
              >> $GITHUB_STEP_SUMMARY
          else
            echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No benchmark results found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Validate UniText glyph delivery
        if: always()
        shell: bash
        run: python3 .github/scripts/validate-unitext-delivery.py .
