name: Shader and State Contract Check

# Keyword coverage is exhaustive for small spaces and pairwise for larger ones.
on:
  workflow_dispatch:
    inputs:
      full:
        description: "Run the complete sweep (uncheck for the two early-signal legs only)"
        type: boolean
        default: true

permissions:
  contents: read
  checks: write

concurrency:
  group: shader-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Check out the matrix definitions
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/ci/shader-compile

      - name: Select the requested matrix
        id: select
        shell: bash
        env:
          FULL: ${{ inputs.full }}
        run: |
          set -euo pipefail
          cd .github/ci/shader-compile
          if [ "$FULL" = "true" ]; then
            MATRIX=$(jq -c . matrix-full.json)
            echo "Matrix: the complete sweep."
          else
            MATRIX=$(jq -c . matrix-fast.json)
            echo "Matrix: the two early-signal legs."
          fi
          echo "$MATRIX" | jq -r '.include[] | "  \(.name) [\(.scope)] \(.colorSpaces) / \(.platforms)"'
          {
            echo "matrix<<MATRIX_JSON"
            echo "$MATRIX"
            echo "MATRIX_JSON"
          } >> "$GITHUB_OUTPUT"

  compile:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    # Matrix deadlines are shorter than the compile test's six-hour timeout.
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout project and packages
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          lfs: true
          submodules: recursive

      - name: Setup .NET for LightSide state code generation
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build LightSide state source generator
        shell: bash
        run: |
          dotnet build Packages/media.lightside.core/Tools~/StateCodeGen/LightSide.StateCodeGen.csproj --configuration Release
          test -f Packages/media.lightside.core/Analyzers/LightSide.StateCodeGen.dll
          test ! -f Packages/media.lightside.core/Analyzers/LightSide.StateCodeGen.deps.json

      # Keyed by project, not by leg: the color-space halves and the early-signal leg of one project
      # share a Library, so whichever finishes first warms the rest. Seven projects fit the
      # repository's 10 GB of cache; keying per leg would not.
      - name: Restore Unity Library
        id: unity-library
        uses: actions/cache/restore@v5
        with:
          path: .github/ci/shader-compile/projects/${{ matrix.project }}/Library
          key: shader-library-${{ matrix.project }}-${{ hashFiles('.github/ci/shader-compile/**', 'Packages/media.lightside.core/**', 'Packages/media.lightside.unitext/**', 'Packages/media.lightside.unishapes/**', 'Packages/media.lightside.unilottie/**', 'Packages/media.lightside.unieffects/**') }}
          restore-keys: |
            shader-library-${{ matrix.project }}-

      - name: Restore successful shader verifications
        id: shader-verifications
        uses: actions/cache/restore@v5
        with:
          path: .github/ci/shader-compile/projects/${{ matrix.project }}/Library/LightSideShaderChecks
          key: shader-verifications-v2-${{ matrix.project }}-${{ matrix.colorSpaces }}-${{ matrix.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            shader-verifications-v2-${{ matrix.project }}-${{ matrix.colorSpaces }}-${{ matrix.scope }}-
            shader-verifications-v2-${{ matrix.project }}-${{ matrix.colorSpaces }}-

      - name: Run shader and serialized-state contract tests
        id: shader-tests
        uses: game-ci/unity-test-runner@08fd329f00a18efa297140b14ac28ebce742759e
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .github/ci/shader-compile/projects/${{ matrix.project }}
          unityVersion: ${{ matrix.unity }}
          testMode: EditMode
          artifactsPath: artifacts/${{ matrix.project }}
          customParameters: -expectedRenderPipeline ${{ matrix.pipeline }} -shaderColorSpaces ${{ matrix.colorSpaces }} -shaderPlatforms ${{ matrix.platforms }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Shader and State Contracts (${{ matrix.scope }}) - ${{ matrix.name }}

      - name: Save successful shader verifications
        if: always() && steps.shader-tests.outcome != 'skipped' && steps.shader-verifications.outputs.cache-primary-key != ''
        uses: actions/cache/save@v5
        with:
          path: .github/ci/shader-compile/projects/${{ matrix.project }}/Library/LightSideShaderChecks
          key: ${{ steps.shader-verifications.outputs.cache-primary-key }}

      # The Library carries the fixture's imports — the pipeline packages take minutes to import cold —
      # and a red run warms it just as well as a green one; actions/cache's own post step saves only on
      # success.
      # continue-on-error: the legs of one project race for the same key, and the losers are expected
      # to find it already taken.
      - name: Save Unity Library
        if: always() && steps.unity-library.outputs.cache-hit != 'true' && steps.unity-library.outputs.cache-primary-key != ''
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .github/ci/shader-compile/projects/${{ matrix.project }}/Library
          key: ${{ steps.unity-library.outputs.cache-primary-key }}

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ShaderDiagnostics-${{ matrix.project }}-${{ matrix.scope }}-${{ matrix.colorSpaces }}
          path: artifacts/${{ matrix.project }}
          if-no-files-found: warn
          retention-days: 14

      - name: Upload shader statistics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ShaderStats-${{ matrix.project }}-${{ matrix.scope }}-${{ matrix.colorSpaces }}
          path: .github/ci/shader-compile/projects/${{ matrix.project }}/ShaderStats
          if-no-files-found: warn
          retention-days: 1

  statistics:
    name: Shader statistics
    needs: compile
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the statistics of every leg
        uses: actions/download-artifact@v8
        with:
          pattern: ShaderStats-*
          path: stats
          merge-multiple: true

      - name: Merge the tables and publish the summary
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tables=(stats/variants-*.csv)
          if [ ${#tables[@]} -eq 0 ]; then
            echo "::error::No leg produced shader statistics."
            exit 1
          fi
          mkdir -p merged
          awk 'FNR > 1 || NR == 1' "${tables[@]}" > merged/shader-statistics.csv
          cat stats/summary-*.md > merged/shader-statistics.md
          { echo "# Shader statistics"; echo; cat merged/shader-statistics.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the merged statistics
        uses: actions/upload-artifact@v6
        with:
          name: ShaderStatistics
          path: merged
          retention-days: 90
