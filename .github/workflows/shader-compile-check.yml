name: Shader and State Contract Check

# Pushes and pull requests run two early-signal legs; the nightly run and a manual dispatch carry the
# complete sweep — every editor, both color spaces, every compiler platform. The complete sweep stays
# off the push path: while it still compiled every keyword combination it took 5.5 hours and ~40
# runner-hours without finishing (measured 2026-09-06), and the covering sets it compiles now keep that
# budget where pushes never wait on it. A dispatch with `full: false` runs the two early legs alone.
on:
  workflow_dispatch:
    inputs:
      full:
        description: "Run the complete sweep (uncheck for the two early-signal legs only)"
        type: boolean
        default: true
  schedule:
    - cron: "0 2 * * *"
  push:
    branches: ["**"]
    paths:
      - "Packages/media.lightside.core"
      - "Packages/media.lightside.unilottie"
      - "Packages/media.lightside.unishapes"
      - "Packages/media.lightside.unitext"
      - ".github/ci/shader-compile/**"
      - ".github/workflows/shader-compile-check.yml"
  pull_request:
    paths:
      - "Packages/media.lightside.core"
      - "Packages/media.lightside.unilottie"
      - "Packages/media.lightside.unishapes"
      - "Packages/media.lightside.unitext"
      - ".github/ci/shader-compile/**"
      - ".github/workflows/shader-compile-check.yml"

permissions:
  contents: read
  checks: write

concurrency:
  group: shader-compile-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Check out the matrix definitions
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/ci/shader-compile

      - name: Select the matrix for this trigger
        id: select
        shell: bash
        env:
          FULL: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) }}
        run: |
          set -euo pipefail
          cd .github/ci/shader-compile
          if [ "$FULL" = "true" ]; then
            MATRIX=$(jq -c . matrix-full.json)
            echo "Matrix: the complete sweep."
          else
            MATRIX=$(jq -c . matrix-fast.json)
            echo "Matrix: the two early-signal legs."
          fi
          echo "$MATRIX" | jq -r '.include[] | "  \(.name) [\(.scope)] \(.colorSpaces) / \(.platforms)"'
          {
            echo "matrix<<MATRIX_JSON"
            echo "$MATRIX"
            echo "MATRIX_JSON"
          } >> "$GITHUB_OUTPUT"

  compile:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    # The only timeout in the system: the compile test carries none, because how long a sweep may take
    # is a property of the platforms and color spaces it was handed. The ceilings are generous on
    # purpose, and a full leg is one color space precisely so it stays under GitHub's own 6-hour job
    # ceiling however cold the fixture's Library is.
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout project and packages
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          lfs: true
          submodules: recursive

      - name: Setup .NET for LightSide state code generation
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build LightSide state source generator
        shell: bash
        run: |
          dotnet build Packages/media.lightside.core/Tools~/StateCodeGen/LightSide.StateCodeGen.csproj --configuration Release
          test -f Packages/media.lightside.core/Analyzers/LightSide.StateCodeGen.dll
          test ! -f Packages/media.lightside.core/Analyzers/LightSide.StateCodeGen.deps.json

      # Keyed by project, not by leg: the color-space halves and the early-signal leg of one project
      # share a Library, so whichever finishes first warms the rest. Seven projects fit the
      # repository's 10 GB of cache; keying per leg would not.
      - name: Restore Unity Library
        id: unity-library
        uses: actions/cache/restore@v5
        with:
          path: .github/ci/shader-compile/projects/${{ matrix.project }}/Library
          key: shader-library-${{ matrix.project }}-${{ hashFiles('.github/ci/shader-compile/**', 'Packages/media.lightside.core/**', 'Packages/media.lightside.unitext/**', 'Packages/media.lightside.unishapes/**', 'Packages/media.lightside.unilottie/**') }}
          restore-keys: |
            shader-library-${{ matrix.project }}-

      - name: Run shader and serialized-state contract tests
        id: shader-tests
        uses: game-ci/unity-test-runner@08fd329f00a18efa297140b14ac28ebce742759e
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .github/ci/shader-compile/projects/${{ matrix.project }}
          unityVersion: ${{ matrix.unity }}
          testMode: EditMode
          artifactsPath: artifacts/${{ matrix.project }}
          customParameters: -expectedRenderPipeline ${{ matrix.pipeline }} -shaderColorSpaces ${{ matrix.colorSpaces }} -shaderPlatforms ${{ matrix.platforms }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Shader and State Contracts (${{ matrix.scope }}) - ${{ matrix.name }}

      # The Library carries the fixture's imports — the pipeline packages take minutes to import cold —
      # and a red run warms it just as well as a green one; actions/cache's own post step saves only on
      # success.
      # continue-on-error: the legs of one project race for the same key, and the losers are expected
      # to find it already taken.
      - name: Save Unity Library
        if: always() && steps.unity-library.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .github/ci/shader-compile/projects/${{ matrix.project }}/Library
          key: shader-library-${{ matrix.project }}-${{ hashFiles('.github/ci/shader-compile/**', 'Packages/media.lightside.core/**', 'Packages/media.lightside.unitext/**', 'Packages/media.lightside.unishapes/**', 'Packages/media.lightside.unilottie/**') }}

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ShaderDiagnostics-${{ matrix.project }}-${{ matrix.scope }}-${{ matrix.colorSpaces }}
          path: artifacts/${{ matrix.project }}
          if-no-files-found: warn
          retention-days: 14
